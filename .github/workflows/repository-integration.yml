name: Repository integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokepod-repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-result-firmware:
    name: PR merge-result firmware source gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MERGE_RESULT_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - name: Check out PR merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MERGE_RESULT_SHA }}
          persist-credentials: false
      - name: Bootstrap host tools
        working-directory: projects/pokepod-amoled
        run: ./tools/bootstrap-ci.sh --install
      - name: Run firmware source gate on merge result
        working-directory: projects/pokepod-amoled
        run: ./firmware/run-source-only-tests.sh

  mac:
    name: macOS Swift tests and release build
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Swift tests
        working-directory: projects/pokecapsule-mac
        run: swift test --parallel
      - name: Build Swift release products
        working-directory: projects/pokecapsule-mac
        run: swift build -c release

  android:
    name: Android Poke3 and modern-phone variants
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up locked Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.14.5"
      - name: Run both Android product lines
        working-directory: projects/pokecapsule-android
        run: |
          set -euo pipefail
          release_store_file="$RUNNER_TEMP/pokecapsule-ci-release.p12"
          release_store_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          release_key_alias="pokecapsule-ci"
          release_key_password="$release_store_password"
          printf '::add-mask::%s\n' "$release_store_password"
          cleanup() {
            rm -f "$release_store_file"
          }
          trap cleanup EXIT
          keytool -genkeypair -noprompt \
            -alias "$release_key_alias" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -storetype PKCS12 -keystore "$release_store_file" \
            -storepass "$release_store_password" \
            -keypass "$release_key_password" \
            -dname 'CN=PokeCapsule CI,O=PokePod'
          ./build.sh \
            "-PreleaseStoreFile=$release_store_file" \
            "-PreleaseStorePassword=$release_store_password" \
            "-PreleaseKeyAlias=$release_key_alias" \
            "-PreleaseKeyPassword=$release_key_password" \
            testPoke3LegacyDebugUnitTest testPhoneModernDebugUnitTest \
            lintPoke3LegacyDebug lintPhoneModernDebug \
            assemblePoke3LegacyDebug assemblePhoneModernDebug \
            lintPoke3LegacyRelease lintPhoneModernRelease \
            assemblePoke3LegacyRelease assemblePhoneModernRelease
      - name: Run Android variant contract
        working-directory: projects/pokecapsule-android
        run: python3 test-android-variants.py

  protocol:
    name: Shared protocol schemas and fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned Python runtime
        run: |
          python3 - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 12), sys.version
          print(sys.version)
          PY
      - name: Validate schemas and fixtures without network dependencies
        run: python3 projects/pokecapsule-protocol/validate-fixtures.py
