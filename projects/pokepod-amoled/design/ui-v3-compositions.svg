<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="560" viewBox="0 0 1960 560">
  <rect width="1960" height="560" fill="#e8eeeb"/>
  <style>
    .label{font:700 17px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#17221e}
    .ui{font-family:'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#f4faf7}
    .display{font-size:28px;font-weight:700}.body{font-size:20px;font-weight:650}
    .compact{font-size:16px;font-weight:550;fill:#91a69f}.timer{font-size:36px;font-weight:500}
    .divider{stroke:#1a2a25}.accent{stroke:#69e0b6}.wireless{stroke:#a0b2ff}
  </style>
  <defs>
    <g id="topbar" class="ui">
      <rect x="20" y="16" width="25" height="12" rx="2" fill="none" stroke="#f4faf7" stroke-width="2"/>
      <rect x="22" y="18" width="21" height="8" rx="1" fill="#f4faf7"/>
      <rect x="45" y="19" width="3" height="6" fill="#f4faf7"/>
      <text class="compact" x="56" y="29" fill="#f4faf7">100%</text>
      <path d="M241 17l9-6 9 6m-14 5l5-4 5 4m-5 6v-1" fill="none" stroke="#69e0b6" stroke-width="2"/>
      <rect x="285" y="11" width="18" height="14" rx="2" fill="none" stroke="#a0b2ff" stroke-width="2"/>
      <path d="M290 29h8m-4-4v4" stroke="#a0b2ff" stroke-width="2"/>
    </g>
    <g id="indicator">
      <rect x="154" y="432" width="8" height="3" rx="2" fill="#34413c"/>
      <rect x="177" y="432" width="14" height="3" rx="2" fill="#69e0b6"/>
      <rect x="206" y="432" width="8" height="3" rx="2" fill="#34413c"/>
    </g>
  </defs>

  <text class="label" x="24" y="34">首页 · 独立使用</text>
  <g transform="translate(24 54)"><rect width="368" height="448" rx="54" fill="#000"/><use href="#topbar"/>
    <g class="ui"><text class="display" x="184" y="102" text-anchor="middle">语音胶囊</text>
      <ellipse cx="184" cy="230" rx="127" ry="90" fill="none" stroke="#101a17" stroke-width="2"/>
      <ellipse cx="184" cy="230" rx="108" ry="76" fill="none" stroke="#12372c" stroke-width="2"/>
      <rect x="118" y="197" width="132" height="66" rx="33" fill="#0b1311" stroke="#69e0b6" stroke-width="3"/><path d="M184 200v60" stroke="#69e0b6" stroke-width="2"/>
      <text class="body" x="184" y="378" text-anchor="middle">轻触录音</text></g><use href="#indicator"/>
  </g>

  <text class="label" x="416" y="34">首页 · 连接 Mac</text>
  <g transform="translate(416 54)"><rect width="368" height="448" rx="54" fill="#000"/><use href="#topbar"/>
    <g class="ui"><rect x="20" y="72" width="328" height="166" rx="28" fill="#0b1311" stroke="#1a2a25"/>
      <rect x="49" y="125" width="58" height="30" rx="15" fill="#0b1311" stroke="#69e0b6" stroke-width="2"/><path d="M78 127v26" stroke="#69e0b6"/>
      <text class="display" x="132" y="144">语音胶囊</text><text class="body" x="132" y="188" fill="#69e0b6">轻触录音</text>
      <rect x="20" y="250" width="328" height="166" rx="28" fill="#0b1311" stroke="#1a2a25"/>
      <circle cx="78" cy="333" r="29" fill="none" stroke="#151a2c"/><circle cx="78" cy="333" r="20" fill="none" stroke="#a0b2ff" stroke-width="2"/><path d="M68 333h20m-10-12v24" stroke="#a0b2ff" stroke-width="2"/>
      <text class="display" x="132" y="322">微信语音输入</text><text class="body" x="132" y="366" fill="#a0b2ff">按住说话</text></g><use href="#indicator"/>
  </g>

  <text class="label" x="808" y="34">录音 · 真实声纹</text>
  <g transform="translate(808 54)"><rect width="368" height="448" rx="54" fill="#000"/><use href="#topbar"/>
    <g class="ui"><circle cx="139" cy="96" r="4" fill="#ff786d"/><text class="timer" x="184" y="108" text-anchor="middle">00:18</text>
      <ellipse cx="184" cy="224" rx="132" ry="82" fill="none" stroke="#12372c" stroke-width="2"/><ellipse cx="184" cy="224" rx="114" ry="66" fill="none" stroke="#1a2a25"/>
      <rect x="52" y="176" width="264" height="96" rx="48" fill="#0b1311" stroke="#69e0b6"/>
      <g fill="#69e0b6"><rect x="72" y="216" width="5" height="16" rx="2"/><rect x="82" y="210" width="5" height="28" rx="2"/><rect x="92" y="202" width="5" height="44" rx="2"/><rect x="102" y="212" width="5" height="24" rx="2"/><rect x="112" y="196" width="5" height="56" rx="2"/><rect x="122" y="207" width="5" height="34" rx="2"/><rect x="132" y="214" width="5" height="20" rx="2"/><rect x="142" y="204" width="5" height="40" rx="2"/><rect x="152" y="193" width="5" height="62" rx="2"/><rect x="162" y="209" width="5" height="30" rx="2"/><rect x="172" y="218" width="5" height="12" rx="2"/><rect x="182" y="201" width="5" height="46" rx="2"/><rect x="192" y="211" width="5" height="26" rx="2"/><rect x="202" y="195" width="5" height="58" rx="2"/><rect x="212" y="207" width="5" height="34" rx="2"/><rect x="222" y="215" width="5" height="18" rx="2"/><rect x="232" y="199" width="5" height="50" rx="2"/><rect x="242" y="209" width="5" height="30" rx="2"/><rect x="252" y="216" width="5" height="16" rx="2"/><rect x="262" y="204" width="5" height="40" rx="2"/><rect x="272" y="211" width="5" height="26" rx="2"/><rect x="282" y="218" width="5" height="12" rx="2"/></g>
      <text class="body" x="184" y="382" text-anchor="middle">轻触停止</text></g>
  </g>

  <text class="label" x="1200" y="34">胶囊详情</text>
  <g transform="translate(1200 54)"><rect width="368" height="448" rx="54" fill="#000"/>
    <g class="ui"><path d="M33 19l-10 9 10 9" fill="none" stroke="#69e0b6" stroke-width="2"/><text class="compact" x="253" y="34" fill="#f0c45b">待转写</text><text class="compact" x="20" y="78">08-07 16:20</text>
      <text class="body" x="20" y="126">等待转写</text>
      <g transform="translate(6 352)"><rect width="80" height="72" rx="18" fill="#12372c" stroke="#69e0b6"/><path d="M30 12v18l16-9z" fill="#69e0b6"/><text class="compact" x="40" y="61" text-anchor="middle" fill="#f4faf7">播放</text></g>
      <g transform="translate(98 352)"><rect width="80" height="72" rx="18" fill="#0b1311"/><text class="compact" x="40" y="61" text-anchor="middle">收藏</text></g>
      <g transform="translate(190 352)"><rect width="80" height="72" rx="18" fill="#0b1311"/><text class="compact" x="40" y="61" text-anchor="middle">归档</text></g>
      <g transform="translate(282 352)"><rect width="80" height="72" rx="18" fill="#0b1311"/><text class="compact" x="40" y="61" text-anchor="middle" fill="#34413c">重试</text></g></g>
  </g>

  <text class="label" x="1592" y="34">手机配网 · 子页面</text>
  <g transform="translate(1592 54)"><rect width="368" height="448" rx="54" fill="#000"/>
    <g class="ui"><path d="M33 19l-10 9 10 9" fill="none" stroke="#69e0b6" stroke-width="2"/><text class="body" x="64" y="35">连接手机</text>
      <text class="compact" x="20" y="108">热点名称</text><rect x="20" y="120" width="328" height="82" rx="20" fill="#0b1311"/><text class="body" x="38" y="169">PokePod-A994</text>
      <text class="compact" x="20" y="248">密码</text><rect x="20" y="260" width="328" height="82" rx="20" fill="#0b1311"/><text class="display" x="38" y="314" fill="#f0c45b">88888888</text>
      <text class="compact" x="184" y="398" text-anchor="middle">手机连接热点后打开配置页</text></g>
  </g>
