apply plugin: 'com.android.application'

android {
    namespace 'com.zheliu.pokecapsule'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zheliu.pokecapsule'
        minSdk 23
        targetSdk 28
        versionCode 22
        versionName '1.7.0'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'

    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'ExpiredTargetSdkVersion', 'ChromeOsAbiSupport'
    }
}

dependencies {
    // The workspace Gradle distribution already carries these test jars. Keeping
    // unit tests offline avoids depending on the Mac's optional HTTP proxy.
    testImplementation files(
            '../../../work/toolchains/gradle@8/8.14.5/libexec/lib/junit-4.13.2.jar',
            '../../../work/toolchains/gradle@8/8.14.5/libexec/lib/hamcrest-core-1.3.jar')
    androidTestImplementation files(
            '../../../work/toolchains/gradle@8/8.14.5/libexec/lib/junit-4.13.2.jar',
            '../../../work/toolchains/gradle@8/8.14.5/libexec/lib/hamcrest-core-1.3.jar')
}
