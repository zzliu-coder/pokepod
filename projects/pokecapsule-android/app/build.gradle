apply plugin: 'com.android.application'

def releaseStoreFile = project.findProperty('releaseStoreFile')
def releaseStorePassword = project.findProperty('releaseStorePassword')
def releaseKeyAlias = project.findProperty('releaseKeyAlias')
def releaseKeyPassword = project.findProperty('releaseKeyPassword')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias,
                         releaseKeyPassword].every { value -> value != null && !value.toString().isEmpty() }
if (project.findProperty('requireReleaseSigning')?.toString() == 'true' && !hasReleaseSigning) {
    throw new GradleException('requireReleaseSigning=true requires an external release keystore')
}

android {
    namespace 'com.zheliu.pokecapsule'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zheliu.pokecapsule'
        minSdk 23
        versionCode 22
        versionName '1.7.0'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'

    }

    flavorDimensions 'device'
    productFlavors {
        // BOOX Poke3 keeps the legacy shared-storage contract used by the
        // existing /sdcard/PokeCapsule library and its old Android system.
        poke3Legacy {
            dimension 'device'
            targetSdk 28
        }
        // Ordinary Android phones use current permission behavior. The app
        // gates all library access on MANAGE_EXTERNAL_STORAGE before startup.
        phoneModern {
            dimension 'device'
            targetSdk 34
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'ExpiredTargetSdkVersion', 'ChromeOsAbiSupport'
    }
}

dependencies {
    // The workspace Gradle distribution already carries these test jars. Keeping
    // unit tests offline avoids depending on the Mac's optional HTTP proxy.
    def gradleTestLib = System.getenv('POKECAPSULE_GRADLE_TEST_LIB')
            ?: '../../../work/toolchains/gradle@8/8.14.5/libexec/lib'
    if (file("${gradleTestLib}/junit-4.13.2.jar").isFile()
            && file("${gradleTestLib}/hamcrest-core-1.3.jar").isFile()) {
        testImplementation files(
                "${gradleTestLib}/junit-4.13.2.jar",
                "${gradleTestLib}/hamcrest-core-1.3.jar")
        androidTestImplementation files(
                "${gradleTestLib}/junit-4.13.2.jar",
                "${gradleTestLib}/hamcrest-core-1.3.jar")
    } else {
        testImplementation 'junit:junit:4.13.2'
        androidTestImplementation 'junit:junit:4.13.2'
    }
}
