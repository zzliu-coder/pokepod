apply plugin: 'com.android.application'

android {
    namespace 'com.zheliu.pokecapsule'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zheliu.pokecapsule'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'android.app.InstrumentationTestRunner'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
                arguments '-DWHISPER_BUILD_TESTS=OFF',
                        '-DWHISPER_BUILD_EXAMPLES=OFF',
                        '-DWHISPER_BUILD_SERVER=OFF',
                        "-DFETCHCONTENT_SOURCE_DIR_WHISPERCPP=${file('../../../work/vendor/whisper.cpp').absolutePath}",
                        '-DGGML_OPENMP=OFF',
                        '-DGGML_VULKAN=OFF',
                        '-DGGML_OPENCL=OFF'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '27.2.12479018'

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'ExpiredTargetSdkVersion', 'ChromeOsAbiSupport'
    }
}

dependencies {
    // The workspace Gradle distribution already carries these test jars. Keeping
    // unit tests offline avoids depending on the Mac's optional HTTP proxy.
    testImplementation files(
            '../../../work/toolchains/gradle@8/8.14.5/libexec/lib/junit-4.13.2.jar',
            '../../../work/toolchains/gradle@8/8.14.5/libexec/lib/hamcrest-core-1.3.jar')
}
